# ── Development ─────────────────────────────────────────────────────────────
# Lee la configuración desde el .env de la raíz del proyecto.
#
# Modos de uso:
#   Modo A — BD local en contenedor:  docker compose --profile local-db up
#                                     Requiere DB_HOST=db en el .env raíz
#   Modo B — BD externa:              docker compose up
#                                     Requiere DB_HOST=<servidor> en el .env raíz
#   Sin Docker (php artisan):         DB_HOST=localhost en el .env raíz
#
# Frontend:  http://localhost:5173
# Backend:   http://localhost:8000

services:
  db:
    image: postgres:16-alpine
    profiles: [local-db]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-finanzas}
      POSTGRES_USER: ${DB_USERNAME:-finanzas_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-finanzas_admin} -d ${DB_DATABASE:-finanzas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    env_file: [.env]
    environment:
      # Fijos en Docker — sobreescriben los valores del .env
      DB_CONNECTION: pgsql
      DB_HOST: db
      APP_ENV: local
      APP_DEBUG: "true"
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file: [.env]
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data_dev:
