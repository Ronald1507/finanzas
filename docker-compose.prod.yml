# ── Production ──────────────────────────────────────────────────────────────
# Uses MySQL. Frontend compiled to static assets served by nginx.
#
# Required env vars (set in shell or a .env file at this directory):
#   APP_KEY            — Laravel app key (base64:...)
#   DB_PASSWORD        — MySQL user password
#   DB_ROOT_PASSWORD   — MySQL root password
#   VITE_API_URL       — Public URL of the backend (e.g. https://api.tudominio.com)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Frontend:  http://localhost:80
# Backend:   http://localhost:8000

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: finanzas
      MYSQL_USER: finanzas
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: prod
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${BACKEND_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: finanzas
      DB_USERNAME: finanzas
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
